<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SokoHub - Rider Dashboard</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

header {
    background: #0b7a3b;
    color: white;
    padding: 18px;
    text-align: center;
}

.container {
    width: 94%;
    max-width: 900px;
    margin: 20px auto;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

h2, h3 {
    margin-top: 0;
}

.info {
    line-height: 1.7;
}

.order {
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 15px;
    margin-top: 15px;
}

.status {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 20px;
    background: #eee;
    font-size: 13px;
    margin: 5px 0;
}

button {
    border: none;
    border-radius: 8px;
    padding: 12px 16px;
    margin: 5px 3px;
    font-size: 15px;
    cursor: pointer;
}

.btn-green {
    background: #0b7a3b;
    color: white;
}

.btn-blue {
    background: #1976d2;
    color: white;
}

.btn-orange {
    background: #ef6c00;
    color: white;
}

.btn-red {
    background: #d32f2f;
    color: white;
}

.btn-gray {
    background: #555;
    color: white;
}

.location-box {
    background: #eef8f1;
    border: 1px solid #b8dfc5;
    padding: 14px;
    border-radius: 10px;
    margin-top: 15px;
}

.empty {
    text-align: center;
    padding: 25px;
    color: #777;
}

.loading {
    text-align: center;
    padding: 20px;
}

.small {
    font-size: 13px;
    color: #666;
}
</style>
</head>

<body>

<header>
    <h1>🏍️ SokoHub Rider Dashboard</h1>
    <p>Delivery Management</p>
</header>

<div class="container">

    <!-- RIDER INFORMATION -->
    <div class="card">

        <h2>👤 Taarifa za Rider</h2>

        <div class="info">
            <div>
                🟢 <strong>Rider ame-login</strong>
            </div>

            <div>
                <strong>Rider UID:</strong>
                <span id="riderUID">...</span>
            </div>

            <div>
                <strong>Email:</strong>
                <span id="riderEmail">...</span>
            </div>
        </div>

        <br>

        <button class="btn-gray" onclick="goHome()">
            🏠 Home
        </button>

        <button class="btn-red" onclick="logout()">
            🚪 Logout
        </button>

    </div>


    <!-- GPS STATUS -->
    <div class="card">

        <h3>📍 GPS Status</h3>

        <div id="gpsStatus" class="location-box">
            📍 GPS haijaanza
        </div>

        <p class="small">
            GPS itaanza unapobonyeza
            <strong>Anza Delivery + GPS</strong>.
        </p>

    </div>


    <!-- ORDERS -->
    <div class="card">

        <h2>📦 Oda za Delivery</h2>

        <div id="ordersContainer" class="loading">
            Inapakia oda...
        </div>

    </div>

</div>


<script type="module">

import { auth, db } from "./firebase.js";

import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
    collection,
    getDocs,
    doc,
    updateDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


let currentRider = null;


/* ==================================================
   AUTH CHECK
================================================== */

onAuthStateChanged(auth, async (user) => {

    if (!user) {

        window.location.href = "login.html";
        return;

    }

    currentRider = user;

    document.getElementById("riderUID").textContent =
        user.uid;

    document.getElementById("riderEmail").textContent =
        user.email || "Hakuna email";

    await loadRiderOrders(user.uid);

});


/* ==================================================
   LOAD RIDER ORDERS
================================================== */

async function loadRiderOrders(riderUID) {

    const container =
        document.getElementById("ordersContainer");

    container.innerHTML =
        `<div class="loading">⏳ Inatafuta oda...</div>`;

    try {

        const snapshot =
            await getDocs(
                collection(db, "orders")
            );

        let orders = [];

        snapshot.forEach((orderDoc) => {

            const order =
                orderDoc.data();

            const orderId =
                orderDoc.id;


            /*
             AVAILABLE ORDERS
            */

            const available =
                (
                    (
                        order.status === "confirmed" ||
                        order.status === "ready" ||
                        order.status === "ready_for_pickup" ||
                        order.status === "accepted"
                    )
                    &&
                    !order.riderId
                );


            /*
             MY ACTIVE ORDERS
            */

            const myOrder =
                (
                    order.riderId === riderUID &&
                    (
                        order.status === "picked_up" ||
                        order.status === "on_the_way"
                    )
                );


            if (available || myOrder) {

                orders.push({
                    id: orderId,
                    data: order
                });

            }

        });


        /*
        NEWEST FIRST
        */

        orders.sort((a, b) => {

            const timeA =
                a.data.createdAt?.seconds || 0;

            const timeB =
                b.data.createdAt?.seconds || 0;

            return timeB - timeA;

        });


        container.innerHTML = "";


        if (orders.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    📦 Hakuna oda kwa sasa.
                    <br><br>
                    Mfumo umeangalia
                    <strong>${snapshot.size}</strong>
                    oda kwenye Firestore.
                </div>
            `;

            return;

        }


        orders.forEach((item) => {

            displayOrder(
                item.id,
                item.data
            );

        });


    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="empty">
                ❌ Imeshindikana kupakia oda.
                <br><br>
                ${error.message}
            </div>
        `;

    }

}


/* ==================================================
   DISPLAY ORDER
================================================== */

function displayOrder(orderId, order) {

    const container =
        document.getElementById("ordersContainer");


    const orderDiv =
        document.createElement("div");

    orderDiv.className = "order";


    let actionButton = "";


    /*
    ORDER READY FOR PICKUP
    */

    if (
        order.status === "confirmed" ||
        order.status === "ready" ||
        order.status === "ready_for_pickup"
    ) {

        actionButton = `
            <button
                class="btn-green"
                onclick="pickupOrder('${orderId}')">

                📦 CHUKUA ODA

            </button>
        `;

    }


    /*
    PICKED UP
    */

    else if (
        order.status === "picked_up" &&
        order.riderId === currentRider.uid
    ) {

        actionButton = `
            <button
                class="btn-orange"
                onclick="startDelivery('${orderId}')">

                🚴 ANZA DELIVERY + GPS

            </button>
        `;

    }


    /*
    ALREADY ON THE WAY
    */

    else if (
        order.status === "on_the_way" &&
        order.riderId === currentRider.uid
    ) {

        actionButton = `
            <button
                class="btn-blue"
                onclick="openTracking('${orderId}')">

                📍 ENDELEA LIVE GPS

            </button>

            <button
                class="btn-green"
                onclick="completeDelivery('${orderId}')">

                ✅ MFIKISHE CUSTOMER

            </button>
        `;

    }


    /*
    RIDER LOCATION
    */

    let locationHTML = "";

    if (order.riderLocation) {

        locationHTML = `
            <div class="location-box">

                📍 Rider Location

                <br>

                Latitude:
                ${order.riderLocation.latitude}

                <br>

                Longitude:
                ${order.riderLocation.longitude}

            </div>
        `;

    }


    orderDiv.innerHTML = `

        <h3>📦 Oda #${orderId}</h3>

        <div>
            <span class="status">
                Status:
                <strong>
                    ${order.status || "unknown"}
                </strong>
            </span>
        </div>

        <p>
            👤 Customer:
            <strong>
                ${order.customerName || "Customer"}
            </strong>
        </p>

        <p>
            📞 Simu:
            ${order.phone || "Haijawekwa"}
        </p>

        <p>
            📍 Delivery:
            ${order.deliveryLocation || "Haijawekwa"}
        </p>

        <p>
            💰 Jumla:
            <strong>
                TZS ${Number(order.total || 0).toLocaleString()}
            </strong>
        </p>

        <p>
            💳 Payment:
            ${order.paymentMethod || "Haijawekwa"}
        </p>

        ${locationHTML}

        <div>
            ${actionButton}
        </div>

    `;


    container.appendChild(orderDiv);

}


/* ==================================================
   PICKUP ORDER
================================================== */

window.pickupOrder = async function(orderId) {

    if (!currentRider) {

        alert("Rider haja-login.");
        return;

    }


    try {

        await updateDoc(
            doc(db, "orders", orderId),
            {

                riderId:
                    currentRider.uid,

                status:
                    "picked_up",

                riderAssignedAt:
                    serverTimestamp()

            }
        );


        alert(
            "✅ Oda imechukuliwa.\n\n" +
            "Sasa bonyeza ANZA DELIVERY + GPS."
        );


        await loadRiderOrders(
            currentRider.uid
        );


    } catch (error) {

        console.error(error);

        alert(
            "❌ Imeshindikana kuchukua oda:\n" +
            error.message
        );

    }

};


/* ==================================================
   START DELIVERY
================================================== */

window.startDelivery = async function(orderId) {

    if (!currentRider) {

        alert("Rider haja-login.");
        return;

    }


    /*
    CHECK GPS SUPPORT
    */

    if (!navigator.geolocation) {

        alert(
            "❌ Simu/browser hii hai-support GPS."
        );

        return;

    }


    /*
    CHECK HTTPS
    */

    if (
        !window.isSecureContext &&
        location.hostname !== "localhost" &&
        location.hostname !== "127.0.0.1"
    ) {

        alert(
            "❌ GPS inahitaji HTTPS.\n\n" +
            "Tumia GitHub Pages yenye HTTPS."
        );

        return;

    }


    try {

        document.getElementById("gpsStatus").innerHTML =
            "📍 Inathibitisha GPS...";


        /*
        GET FIRST LOCATION
        */

        const position =
            await getCurrentPosition();


        const coords =
            position.coords;


        const latitude =
            coords.latitude;

        const longitude =
            coords.longitude;

        const accuracy =
            coords.accuracy;


        /*
        SAVE INITIAL LOCATION
        */

        await updateDoc(
            doc(db, "orders", orderId),
            {

                status:
                    "on_the_way",

                riderId:
                    currentRider.uid,

                riderLocation: {

                    latitude:
                        latitude,

                    longitude:
                        longitude,

                    accuracy:
                        accuracy,

                    speed:
                        coords.speed,

                    heading:
                        coords.heading

                },

                locationUpdatedAt:
                    serverTimestamp(),

                deliveryStartedAt:
                    serverTimestamp()

            }
        );


        document.getElementById("gpsStatus").innerHTML = `
            🟢 GPS imewashwa
            <br>
            Latitude: ${latitude}
            <br>
            Longitude: ${longitude}
            <br>
            Accuracy: ${Math.round(accuracy)} m
        `;


        /*
        OPEN LOCATION PAGE
        */

        window.location.href =
            "location.html?orderId=" +
            encodeURIComponent(orderId);


    } catch (error) {

        console.error(error);

        document.getElementById("gpsStatus").innerHTML =
            "🔴 GPS haijaanza";

        alert(
            "❌ Imeshindikana kuanza GPS.\n\n" +
            error.message
        );

    }

};


/* ==================================================
   GET CURRENT POSITION
================================================== */

function getCurrentPosition() {

    return new Promise((resolve, reject) => {

        navigator.geolocation.getCurrentPosition(

            resolve,

            reject,

            {
                enableHighAccuracy: true,
                timeout: 20000,
                maximumAge: 0
            }

        );

    });

}


/* ==================================================
   OPEN TRACKING
================================================== */

window.openTracking = function(orderId) {

    window.location.href =
        "location.html?orderId=" +
        encodeURIComponent(orderId);

};


/* ==================================================
   COMPLETE DELIVERY
================================================== */

window.completeDelivery = async function(orderId) {

    if (!currentRider) {

        alert("Rider haja-login.");
        return;

    }


    const confirmDelivery =
        confirm(
            "Una uhakika umefikisha oda kwa customer?"
        );


    if (!confirmDelivery) {
        return;
    }


    try {

        await updateDoc(
            doc(db, "orders", orderId),
            {

                status:
                    "delivered",

                deliveredAt:
                    serverTimestamp(),

                deliveryCompletedBy:
                    currentRider.uid

            }
        );


        alert(
            "✅ Delivery imekamilika!"
        );


        await loadRiderOrders(
            currentRider.uid
        );


    } catch (error) {

        console.error(error);

        alert(
            "❌ Imeshindikana kukamilisha delivery:\n" +
            error.message
        );

    }

};


/* ==================================================
   LOGOUT
================================================== */

window.logout = async function() {

    try {

        await signOut(auth);

        window.location.href =
            "login.html";

    } catch (error) {

        alert(
            "Logout error: " +
            error.message
        );

    }

};


/* ==================================================
   HOME
================================================== */

window.goHome = function() {

    window.location.href =
        "home.html";

};


</script>

</body>
</html>
