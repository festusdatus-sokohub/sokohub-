<!DOCTYPE html>
<html lang="sw">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Sokohub</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="login-box">

    <h1>Sokohub</h1>

    <h2>Karibu</h2>

    <input
        type="email"
        id="email"
        placeholder="Email"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <button onclick="loginUser()">
        Ingia
    </button>

    <p>
        Huna Account?
        <a href="register.html">Jisajili</a>
    </p>

</div>

<script type="module" src="auth.js"></script>

</body>
</html>
