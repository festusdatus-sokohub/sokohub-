<!DOCTYPE html>
<html lang="sw">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Login - SokoHub</title>

<link
    rel="stylesheet"
    href="style.css"
>

</head>


<body>


<div class="login-box">

    <h1>🛒 SokoHub</h1>

    <h2>Karibu Tena</h2>


    <!-- EMAIL -->

    <input
        type="email"
        id="email"
        placeholder="Email"
        autocomplete="email"
    >


    <!-- PASSWORD -->

    <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
    >


    <!-- LOGIN -->

    <button
        id="loginButton"
        onclick="loginUser()"
    >
        🔐 Ingia
    </button>


    <!-- FORGOT PASSWORD -->

    <p>

        <a
            href="#"
            onclick="resetPassword(); return false;"
        >
            🔑 Umesahau Password?
        </a>

    </p>


    <!-- MESSAGE -->

    <p id="loginMessage"></p>


    <p>

        Huna Account?

        <a href="register.html">
            Jisajili
        </a>

    </p>


</div>



<script type="module">


// ==================================================
// FIREBASE
// ==================================================

import {
    auth,
    db
} from "./firebase.js";


import {
    signInWithEmailAndPassword,
    sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";



// ==================================================
// HTML
// ==================================================

const emailInput =
    document.getElementById("email");


const passwordInput =
    document.getElementById("password");


const loginButton =
    document.getElementById("loginButton");


const loginMessage =
    document.getElementById("loginMessage");



// ==================================================
// LOGIN
// ==================================================

window.loginUser =
async function () {


    const email =
        emailInput.value.trim();


    const password =
        passwordInput.value;


    // ----------------------------------------------
    // VALIDATION
    // ----------------------------------------------

    if (!email) {

        loginMessage.textContent =
            "❌ Weka email yako.";

        return;

    }


    if (!password) {

        loginMessage.textContent =
            "❌ Weka password yako.";

        return;

    }


    // ----------------------------------------------
    // BUTTON
    // ----------------------------------------------

    loginButton.disabled =
        true;


    loginButton.textContent =
        "⏳ Inaingia...";


    loginMessage.textContent =
        "";



    try {


        // ==========================================
        // FIREBASE LOGIN
        // ==========================================

        const result =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


        const user =
            result.user;


        console.log(
            "LOGIN SUCCESS:",
            user.uid
        );



        // ==========================================
        // GET USER PROFILE
        // ==========================================

        const userRef =
            doc(
                db,
                "users",
                user.uid
            );


        const userSnap =
            await getDoc(userRef);



        if (!userSnap.exists()) {


            loginMessage.textContent =
                "⚠️ Login imefanikiwa lakini profile ya user haipo Firestore.";


            loginButton.disabled =
                false;


            loginButton.textContent =
                "🔐 Ingia";


            return;

        }



        // ==========================================
        // USER DATA
        // ==========================================

        const userData =
            userSnap.data();


        const role =
            String(
                userData.role || ""
            )
            .toLowerCase()
            .trim();


        console.log(
            "USER ROLE:",
            role
        );



        // ==========================================
        // SAVE LOGIN
        // ==========================================

        localStorage.setItem(
            "sokohubUser",
            JSON.stringify({

                uid:
                    user.uid,

                email:
                    user.email,

                role:
                    role,

                fullName:
                    userData.fullName || ""

            })
        );



        // ==========================================
        // REDIRECT
        // ==========================================

        loginMessage.textContent =
            "✅ Login imefanikiwa...";


        if (
            role === "customer"
        ) {

            window.location.href =
                "customer.html";

        }


        else if (
            role === "seller" ||
            role === "supplier" ||
            role === "retailer"
        ) {

            window.location.href =
                "seller.html";

        }


        else if (
            role === "farmer"
        ) {

            window.location.href =
                "farmer.html";

        }


        else if (
            role === "rider"
        ) {

            window.location.href =
                "rider.html";

        }


        else {


            loginMessage.textContent =
                "⚠️ Login imefanikiwa lakini role yako haijulikani: " +
                role;


            loginButton.disabled =
                false;


            loginButton.textContent =
                "🔐 Ingia";

        }


    }

    catch (error) {


        console.error(
            "LOGIN ERROR:",
            error
        );


        let message =
            "❌ Login imeshindikana.";


        if (
            error.code ===
            "auth/invalid-credential"
        ) {

            message =
                "❌ Email au password si sahihi.";

        }

        else if (
            error.code ===
            "auth/user-not-found"
        ) {

            message =
                "❌ Akaunti haipo.";

        }

        else if (
            error.code ===
            "auth/wrong-password"
        ) {

            message =
                "❌ Password si sahihi.";

        }

        else if (
            error.code ===
            "auth/invalid-email"
        ) {

            message =
                "❌ Email si sahihi.";

        }

        else {

            message =
                "❌ " +
                error.message;

        }


        loginMessage.textContent =
            message;


        loginButton.disabled =
            false;


        loginButton.textContent =
            "🔐 Ingia";

    }

};



// ==================================================
// RESET PASSWORD
// ==================================================

window.resetPassword =
async function () {


    const email =
        emailInput.value.trim();


    // ----------------------------------------------
    // CHECK EMAIL
    // ----------------------------------------------

    if (!email) {

        alert(
            "📧 Kwanza andika email yako kwenye sehemu ya Email."
        );

        emailInput.focus();

        return;

    }



    // ----------------------------------------------
    // CONFIRM
    // ----------------------------------------------

    const confirmed =
        confirm(

            "🔑 Reset Password\n\n" +

            "Tutakutumia link ya kuweka password mpya kwenye:\n\n" +

            email +

            "\n\nEndelea?"

        );


    if (!confirmed) {

        return;

    }



    try {


        loginMessage.textContent =
            "⏳ Inatuma reset link...";



        // ==========================================
        // SEND RESET EMAIL
        // ==========================================

        await sendPasswordResetEmail(
            auth,
            email
        );



        // ==========================================
        // SUCCESS
        // ==========================================

        loginMessage.textContent =
            "✅ Reset link imetumwa kwenye email yako.";


        alert(

            "✅ Reset link imetumwa!\n\n" +

            "Angalia Inbox yako.\n" +

            "Kama huioni, angalia Spam/Junk.\n\n" +

            "Fungua link iliyopo kwenye email hiyo " +

            "kisha weka password mpya."

        );


    }

    catch (error) {


        console.error(
            "RESET PASSWORD ERROR:",
            error
        );


        let message =
            "❌ Imeshindikana kutuma reset link.";


        if (
            error.code ===
            "auth/invalid-email"
        ) {

            message =
                "❌ Email uliyoandika si sahihi.";

        }

        else if (
            error.code ===
            "auth/user-not-found"
        ) {

            message =
                "❌ Hakuna account yenye email hiyo.";

        }

        else if (
            error.code ===
            "auth/too-many-requests"
        ) {

            message =
                "⚠️ Umejaribu mara nyingi. Subiri kidogo kisha ujaribu tena.";

        }

        else {

            message =
                "❌ " +
                error.message;

        }


        loginMessage.textContent =
            message;


        alert(
            message
        );

    }

};


</script>


</body>

</html>
